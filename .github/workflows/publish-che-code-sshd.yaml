name: Publish Che Code SSHD

# Trigger the workflow on pull request
on: [workflow_dispatch]

jobs:
  dev:
    name: dev
    runs-on: ubuntu-22.04
    steps:

      - name: Checkout che-code source code
        uses: actions/checkout@v2

      - name: Login to Quay.io
        uses: docker/login-action@v2
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_PULL_REQUESTS_USERNAME }}
          password: ${{ secrets.QUAY_PULL_REQUESTS_PASSWORD }}

      - name: Build Che-Code Docker image
        run: |

          docker buildx build \
            --platform linux/amd64 \
            --progress=plain \
            --push \
            -f build/dockerfiles/assembly.sshd.Dockerfile \
            -t quay.io/rgrunber/che-code-sshd:latest .


      - name: Display docker images
        run: |
          docker images
